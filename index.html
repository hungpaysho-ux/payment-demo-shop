  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M18 25h28l-3 24H21z' fill='white'/%3E%3Cpath d='M25 27c0-10 14-10 14 0' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#10203b;--blue:#1d4ed8;--sky:#eaf2ff;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--white:#fff;--orange:#f59e0b;--danger:#b42318;--shadow:0 18px 45px rgba(15,32,59,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:#f6f8fc;font-size:16px;line-height:1.6}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.bar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--navy);letter-spacing:.02em}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--blue);color:#fff}.header-actions{display:flex;align-items:center;gap:10px}.env-select{padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--navy);font:inherit;font-weight:800}.env-badge{padding:7px 11px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:.82rem;font-weight:900}.env-badge.test{background:#ecfdf3;color:#067647}.env-badge.production{background:#fff1f2;color:#b42318}.env-banner{margin:18px auto 0;padding:13px 17px;border-radius:13px;background:#f1f5f9;color:#475569;font-weight:800}.env-banner.test{background:#ecfdf3;border:1px solid #abefc6;color:#067647}.env-banner.production{background:#fff1f2;border:1px solid #fecdd3;color:#b42318}.cart-btn,.primary,.secondary{border:0;border-radius:12px;cursor:pointer;font-weight:800}.cart-btn{padding:10px 16px;background:var(--navy);color:#fff}.cart-count{display:inline-grid;place-items:center;min-width:24px;height:24px;margin-left:8px;padding:0 7px;border-radius:99px;background:var(--orange);color:#1f2937}
    .intro{padding:56px 0 32px}.intro-box{padding:42px;border-radius:26px;color:#fff;background:linear-gradient(125deg,#10203b 0%,#1d4ed8 68%,#38bdf8 140%);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}.eyebrow{font-weight:800;color:#bfdbfe}.intro h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.1;margin:8px 0 16px}.intro p{max-width:680px;margin:0;color:#dbeafe}.safe{padding:16px 18px;border:1px solid rgba(255,255,255,.25);border-radius:16px;background:rgba(255,255,255,.1);min-width:220px}.safe b{display:block;font-size:1.1rem}.safe span{font-size:.9rem;color:#dbeafe}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:18px 0}.section-head h2{margin:0;font-size:1.6rem}.section-head p{margin:0;color:var(--muted)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:64px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 26px rgba(15,32,59,.06);transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.visual{height:180px;display:grid;place-items:center;font-size:72px;background:linear-gradient(145deg,var(--tone),#fff);overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover;display:block}.content{padding:20px}.tag{font-size:.8rem;font-weight:800;color:var(--blue);background:var(--sky);border-radius:99px;padding:5px 10px}.content h3{margin:12px 0 4px;font-size:1.2rem}.desc{color:var(--muted);min-height:52px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.price{font-size:1.35rem;font-weight:900;color:var(--navy)}.primary{padding:11px 16px;background:var(--blue);color:#fff}.primary:hover{background:#173ea8}.secondary{padding:11px 16px;background:#eef2f7;color:var(--navy)}
    .drawer{position:fixed;inset:0;z-index:30;display:none}.drawer.open{display:block}.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.52)}.panel{position:absolute;right:0;top:0;height:100%;width:min(480px,100%);background:#fff;padding:24px;overflow:auto;box-shadow:-20px 0 50px rgba(15,23,42,.18)}.panel-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.panel-head h2{margin:0}.close{border:0;background:#eef2f7;border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer}.cart-list{display:grid;gap:14px;margin:20px 0}.cart-item{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}.mini{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;background:var(--sky);font-size:28px;overflow:hidden}.mini img{width:100%;height:100%;object-fit:cover;display:block}.cart-item b{display:block}.qty{display:flex;align-items:center;gap:8px;margin-top:6px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.remove{border:0;background:none;color:var(--danger);cursor:pointer}.empty{text-align:center;color:var(--muted);padding:56px 16px}.summary{border-top:1px solid var(--line);padding-top:18px}.total{display:flex;justify-content:space-between;font-weight:900;font-size:1.25rem}.checkout{width:100%;margin-top:14px;padding:14px}.notice{font-size:.86rem;color:var(--muted);margin:10px 0 0}
    .modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:20px;background:rgba(15,23,42,.6)}.modal.open{display:grid}.modal-card{width:min(560px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:var(--shadow)}.modal-card h2{margin:0 0 6px}.modal-card>p{color:var(--muted);margin-top:0}.pay-options{display:grid;gap:12px;margin:20px 0}.pay-option{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer}.pay-option:has(input:checked){border-color:var(--blue);background:var(--sky)}.pay-option input{margin-top:6px;accent-color:var(--blue)}.pay-option b{display:block}.pay-option span{display:block;font-size:.9rem;color:var(--muted)}.actions{display:flex;gap:10px}.actions button{flex:1;padding:13px}.status{display:none;margin-top:16px;padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412}.status.show{display:block}.result-banner{display:none;margin:18px auto 0;padding:14px 18px;border-radius:14px;background:#ecfdf3;border:1px solid #abefc6;color:#067647;font-weight:700}.result-banner.show{display:block}.result-banner.pending{background:#fff7ed;border-color:#fed7aa;color:#9a3412}button:disabled{opacity:.6;cursor:not-allowed}
    footer{padding:26px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;background:#fff}
    @media(max-width:820px){.intro-box{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{width:min(100% - 22px,1180px)}.bar{height:64px}.brand span:last-child{display:none}.intro{padding-top:24px}.intro-box{padding:26px;border-radius:20px}.products{grid-template-columns:1fr}.visual{height:150px}.section-head{align-items:start;flex-direction:column}.safe{min-width:0}.actions{flex-direction:column}}
  </style>
</head>
<body>
  <header><div class="wrap bar"><div class="brand"><span class="mark">安</span><span id="brandName">安心選物｜ezPay 付款展示商店</span></div><div class="header-actions"><label><span class="sr-only">付款環境</span><select class="env-select" id="environmentSelect" aria-label="切換付款環境"><option value="test" selected>測試環境</option><option value="production">正式環境</option></select></label><span class="env-badge" id="environmentBadge">環境確認中</span><button class="cart-btn" id="openCart" aria-label="開啟購物車">購物車 <span class="cart-count" id="cartCount">0</span></button></div></div></header>
  <main><div class="wrap env-banner" id="environmentBanner" role="status">正在向安全後端確認付款環境…</div><div class="wrap result-banner" id="resultBanner" role="status"></div>
    <section class="intro"><div class="wrap intro-box"><div><div class="eyebrow" id="eyebrow">EZPAY PAYMENT DEMO</div><h1 id="heroTitle">選商品，體驗 ezPay<br>付款流程</h1><p id="heroText">付款環境由安全後端控制，頁面會清楚顯示目前是測試或正式環境。</p></div><div class="safe"><b id="safeTitle">🔒 安全後端處理</b><span id="safeText">商店金鑰不會儲存在 GitHub Pages</span></div></div></section>
    <section class="wrap"><div class="section-head"><div><h2 id="sectionTitle">展示商品</h2><p id="sectionText">選擇商品加入購物車，再使用 ezPay 簡單付結帳。</p></div><p>所有價格均為新台幣</p></div><div class="products" id="products"></div></section>
  </main>
  <div class="drawer" id="drawer" aria-hidden="true"><div class="backdrop" id="backdrop"></div><aside class="panel" aria-label="購物車"><div class="panel-head"><h2>我的購物車</h2><button class="close" id="closeCart" aria-label="關閉購物車">×</button></div><div id="cartList"></div><div class="summary" id="summary"><div class="total"><span>合計</span><span id="total">NT$0</span></div><button class="primary checkout" id="checkout">選擇付款方式</button><p class="notice">實際交易金額會由安全後端重新計算，避免前端金額遭竄改。</p></div></aside></div>
  <div class="modal" id="payModal" role="dialog" aria-modal="true" aria-labelledby="payTitle"><div class="modal-card"><h2 id="payTitle">選擇付款方式</h2><p id="payEnvironmentText">正在確認付款環境…</p><div class="pay-options"><label class="pay-option"><input type="radio" name="payment" value="ezpay_mpg" checked><span><b>簡單付一般支付（非 TWQR）</b><span>電子支付帳戶／約定連結存款帳戶／信用卡</span></span></label><label class="pay-option"><input type="radio" name="payment" value="ezpay_twqr"><span><b>簡單付 TWQR</b><span>使用已啟用 TWQR 的另一間商店</span></span></label></div><div class="actions"><button class="secondary" id="cancelPay">返回購物車</button><button class="primary" id="startPay" disabled>確認環境中…</button></div><div class="status" id="status"></div></div></div>
  <footer><div class="wrap" id="footerText">本網站用於 ezPay 付款功能展示；送出交易前請再次確認環境、商品與金額。</div></footer>
  <script id="shop-config" type="application/json">{"brandName":"安心選物｜ezPay 付款展示商店","eyebrow":"EZPAY PAYMENT DEMO","heroTitle":"選商品，體驗 ezPay｜付款流程","heroText":"付款環境由安全後端控制，頁面會清楚顯示目前是測試或正式環境。","safeTitle":"🔒 安全後端處理","safeText":"商店金鑰不會儲存在 GitHub Pages","sectionTitle":"展示商品","sectionText":"選擇商品加入購物車，再使用 ezPay 簡單付結帳。","footerText":"本網站用於 ezPay 付款功能展示；送出交易前請再次確認環境、商品與金額。","products":[{"id":"P001","name":"晨光濾掛咖啡","price":120,"icon":"☕","tag":"生活選物","tone":"#dbeafe","desc":"三包入測試商品，適合驗證低金額付款。","enabled":true},{"id":"P002","name":"極簡隨身筆記本","price":180,"icon":"📘","tag":"文具","tone":"#e0e7ff","desc":"輕巧方格內頁，示範單品加入購物車。","enabled":true},{"id":"P003","name":"環保冷水隨行杯","price":320,"icon":"🥤","tag":"日常用品","tone":"#cffafe","desc":"耐用隨行杯，適合測試數量與金額變更。","enabled":true},{"id":"P004","name":"城市帆布提袋","price":450,"icon":"🛍️","tag":"配件","tone":"#fef3c7","desc":"大容量提袋，示範不同商品合併結帳。","enabled":true},{"id":"P005","name":"雙孔快速充電器","price":690,"icon":"🔌","tag":"3C 周邊","tone":"#dcfce7","desc":"USB-C 雙孔輸出，適合測試較高交易金額。","enabled":true},{"id":"P006","name":"安心生活禮盒","price":980,"icon":"🎁","tag":"精選禮盒","tone":"#fce7f3","desc":"組合式測試商品，示範完整購物結帳流程。","enabled":true}]}</script>
  <script>
    const API_URL='https://payment-demo-api.hungpaysho.workers.dev';
    const shopConfig=JSON.parse(document.getElementById('shop-config').textContent);['brandName','eyebrow','heroText','safeTitle','safeText','sectionTitle','sectionText','footerText'].forEach(id=>{const el=document.getElementById(id);if(el&&shopConfig[id]!=null)el.textContent=shopConfig[id]});document.getElementById('heroTitle').innerHTML=(shopConfig.heroTitle||'').replaceAll('｜','<br>');document.title=shopConfig.brandName;const products=shopConfig.products.filter(p=>p.enabled!==false);
    let cart=JSON.parse(localStorage.getItem('demoCart')||'{}'),apiStatus=null,selectedEnvironment='test',adminToken='';
    const $=s=>document.querySelector(s),money=n=>'NT$'+n.toLocaleString('zh-TW');
    function log(event,data={}){const logs=JSON.parse(localStorage.getItem('demoLogs')||'[]');logs.push({time:new Date().toISOString(),event,data});localStorage.setItem('demoLogs',JSON.stringify(logs.slice(-100)));console.info('[PaymentDemo]',event,data)}
    function requestHeaders(withJson=false){const headers={'x-ezpay-environment':selectedEnvironment};if(withJson)headers['content-type']='application/json';if(selectedEnvironment==='production')headers['x-ezpay-admin-token']=adminToken;return headers}
    async function loadPaymentStatus(){const badge=$('#environmentBadge'),banner=$('#environmentBanner'),payText=$('#payEnvironmentText'),button=$('#startPay'),selector=$('#environmentSelect');try{let data;if(location.href==='about:srcdoc'){data={ok:true,environment:'test',mpgConfigured:true,twqrConfigured:true,preview:true};selector.disabled=true}else{const response=await fetch(`${API_URL}/api/status`,{cache:'no-store',headers:requestHeaders()});data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||data.error||'STATUS_ERROR')}apiStatus=data;selectedEnvironment=data.environment;selector.value=data.environment;const live=data.environment==='production',label=data.preview?'測試環境（預覽）':live?'正式環境':'測試環境';badge.className=`env-badge ${data.environment}`;badge.textContent=label;banner.className=`wrap env-banner ${data.environment}`;banner.textContent=data.preview?'✓ 離線預覽以測試環境顯示；實際網站可在右上角切換環境。':live?'⚠️ 目前為正式環境：送出付款可能產生實際扣款。':'✓ 目前為測試環境：交易會送至簡單付測試平台，不會產生正式金流。';payText.textContent=live?'目前為正式環境，送出付款可能產生實際扣款。':'目前為測試環境，不會產生正式扣款。';document.querySelector('[value="ezpay_mpg"]').disabled=!data.mpgConfigured;document.querySelector('[value="ezpay_twqr"]').disabled=!data.twqrConfigured;const selected=document.querySelector('input[name=payment]:checked');if(selected?.disabled){const available=document.querySelector('input[name=payment]:not(:disabled)');if(available)available.checked=true}const available=Boolean(data.mpgConfigured||data.twqrConfigured);button.disabled=!available||data.preview;button.textContent=data.preview?'離線預覽不送出付款':available?(live?'前往正式付款':'前往測試付款'):'付款商店尚未設定';log('environment_loaded',{environment:data.environment,preview:Boolean(data.preview),mpgConfigured:data.mpgConfigured,twqrConfigured:data.twqrConfigured});return true}catch(error){apiStatus=null;badge.className='env-badge';badge.textContent='環境讀取失敗';banner.className='wrap env-banner production';banner.textContent=`無法切換付款環境：${error.message}`;payText.textContent='無法確認付款環境，請稍後再試。';button.disabled=true;button.textContent='無法確認環境';log('environment_load_error',{environment:selectedEnvironment,message:error.message});return false}}
    function productVisual(p){return p.image?`<img src="${p.image}" alt="${p.name}" loading="lazy">`:p.icon}
    function renderProducts(){$('#products').innerHTML=products.map(p=>`<article class="card"><div class="visual" style="--tone:${p.tone}">${productVisual(p)}</div><div class="content"><span class="tag">${p.tag}</span><h3>${p.name}</h3><p class="desc">${p.desc}</p><div class="bottom"><span class="price">${money(p.price)}</span><button class="primary" onclick="add('${p.id}')">加入購物車</button></div></div></article>`).join('')}
    function save(){localStorage.setItem('demoCart',JSON.stringify(cart));renderCart()}
    function add(id){cart[id]=(cart[id]||0)+1;save();log('cart_add',{productId:id,quantity:cart[id]});openCart()}
    function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();log('cart_quantity_change',{productId:id,delta:d})}
    function removeItem(id){delete cart[id];save();log('cart_remove',{productId:id})}
    function items(){return products.filter(p=>cart[p.id]).map(p=>({...p,qty:cart[p.id]}))}
    function renderCart(){const list=items(),count=list.reduce((s,p)=>s+p.qty,0),total=list.reduce((s,p)=>s+p.price*p.qty,0);$('#cartCount').textContent=count;$('#total').textContent=money(total);$('#summary').style.display=list.length?'block':'none';$('#cartList').innerHTML=list.length?`<div class="cart-list">${list.map(p=>`<div class="cart-item"><div class="mini">${productVisual(p)}</div><div><b>${p.name}</b><span>${money(p.price*p.qty)}</span><div class="qty"><button onclick="change('${p.id}',-1)" aria-label="減少 ${p.name}">−</button><span>${p.qty}</span><button onclick="change('${p.id}',1)" aria-label="增加 ${p.name}">＋</button></div></div><button class="remove" onclick="removeItem('${p.id}')">移除</button></div>`).join('')}</div>`:'<div class="empty">購物車目前沒有商品</div>'}
    function openCart(){$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
    function closeCart(){$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');document.body.style.overflow=''}
    $('#openCart').onclick=openCart;$('#closeCart').onclick=closeCart;$('#backdrop').onclick=closeCart;
    $('#environmentSelect').onchange=async event=>{const selector=event.target,target=selector.value,previous=selectedEnvironment;if(target==='production'){const entered=prompt('請輸入正式環境切換密碼：','');if(entered===null){selector.value=previous;return}adminToken=entered}else{adminToken=''}selectedEnvironment=target;selector.disabled=true;const success=await loadPaymentStatus();selector.disabled=false;if(!success){alert(target==='production'?'正式環境密碼錯誤，已切回測試環境。':'測試環境目前無法使用。');selectedEnvironment='test';adminToken='';selector.value='test';await loadPaymentStatus()}};
    $('#checkout').onclick=async()=>{closeCart();$('#payModal').classList.add('open');$('#status').classList.remove('show');await loadPaymentStatus();log('checkout_open',{environment:apiStatus?.environment,items:items().map(({id,qty})=>({id,qty}))})};
    $('#cancelPay').onclick=()=>{$('#payModal').classList.remove('open');openCart()};
    $('#startPay').onclick=async()=>{const status=$('#status'),button=$('#startPay');status.classList.remove('show');await loadPaymentStatus();if(!apiStatus)return;const provider=document.querySelector('input[name=payment]:checked')?.value;if(!provider)return;if(apiStatus.environment==='production'&&!confirm('目前是正式環境，送出後可能產生實際扣款。確定要繼續嗎？'))return;button.disabled=true;button.textContent=`正在建立${apiStatus.environment==='production'?'正式':'測試'}訂單…`;try{const response=await fetch(`${API_URL}/api/checkout`,{method:'POST',headers:requestHeaders(true),body:JSON.stringify({provider,items:items().map(p=>({id:p.id,quantity:p.qty}))})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.message||result.error||'建立訂單失敗');if(result.environment!==apiStatus.environment)throw new Error('付款環境在送出期間已變更，請重新操作');log('payment_redirect',{environment:result.environment,provider,orderNo:result.orderNo,amount:result.amount,requestId:result.requestId});if(result.paymentUrl){location.href=result.paymentUrl;return}if(!result.gatewayUrl||!result.fields)throw new Error('付款表單資料不完整');const payForm=document.createElement('form');payForm.method='POST';payForm.action=result.gatewayUrl;for(const [name,value] of Object.entries(result.fields)){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;payForm.appendChild(input)}document.body.appendChild(payForm);payForm.submit()}catch(error){status.textContent=`無法建立訂單：${error.message}`;status.classList.add('show');log('payment_create_error',{environment:apiStatus?.environment,provider,message:error.message});await loadPaymentStatus()}};
    function showReturnResult(){const query=new URLSearchParams(location.search),payment=query.get('payment'),orderNo=query.get('orderNo');if(!payment)return;const banner=$('#resultBanner');banner.classList.add('show');if(payment==='success'){banner.textContent=`付款結果已回傳：訂單 ${orderNo||''} 付款成功。`;cart={};save()}else{banner.classList.add('pending');banner.textContent=`付款結果尚未確認：訂單 ${orderNo||''}，請以背景通知與交易查詢結果為準。`}history.replaceState({},'',location.pathname)}
    window.add=add;window.change=change;window.removeItem=removeItem;renderProducts();renderCart();showReturnResult();loadPaymentStatus();
  </script>
</body>
</html>
