  <style>
    :root{--navy:#10203b;--blue:#1d4ed8;--sky:#eaf2ff;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--white:#fff;--orange:#f59e0b;--danger:#b42318;--shadow:0 18px 45px rgba(15,32,59,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:#f6f8fc;font-size:16px;line-height:1.6}
    button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.bar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--navy);letter-spacing:.02em}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--blue);color:#fff}.cart-btn,.primary,.secondary{border:0;border-radius:12px;cursor:pointer;font-weight:800}.cart-btn{padding:10px 16px;background:var(--navy);color:#fff}.cart-count{display:inline-grid;place-items:center;min-width:24px;height:24px;margin-left:8px;padding:0 7px;border-radius:99px;background:var(--orange);color:#1f2937}
    .intro{padding:56px 0 32px}.intro-box{padding:42px;border-radius:26px;color:#fff;background:linear-gradient(125deg,#10203b 0%,#1d4ed8 68%,#38bdf8 140%);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}.eyebrow{font-weight:800;color:#bfdbfe}.intro h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.1;margin:8px 0 16px}.intro p{max-width:680px;margin:0;color:#dbeafe}.safe{padding:16px 18px;border:1px solid rgba(255,255,255,.25);border-radius:16px;background:rgba(255,255,255,.1);min-width:220px}.safe b{display:block;font-size:1.1rem}.safe span{font-size:.9rem;color:#dbeafe}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:18px 0}.section-head h2{margin:0;font-size:1.6rem}.section-head p{margin:0;color:var(--muted)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:64px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 26px rgba(15,32,59,.06);transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.visual{height:180px;display:grid;place-items:center;font-size:72px;background:linear-gradient(145deg,var(--tone),#fff);overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover;display:block}.content{padding:20px}.tag{font-size:.8rem;font-weight:800;color:var(--blue);background:var(--sky);border-radius:99px;padding:5px 10px}.content h3{margin:12px 0 4px;font-size:1.2rem}.desc{color:var(--muted);min-height:52px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.price{font-size:1.35rem;font-weight:900;color:var(--navy)}.primary{padding:11px 16px;background:var(--blue);color:#fff}.primary:hover{background:#173ea8}.secondary{padding:11px 16px;background:#eef2f7;color:var(--navy)}

    .modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:20px;background:rgba(15,23,42,.6)}.modal.open{display:grid}.modal-card{width:min(560px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:var(--shadow)}.modal-card h2{margin:0 0 6px}.modal-card>p{color:var(--muted);margin-top:0}.pay-options{display:grid;gap:12px;margin:20px 0}.pay-option{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer}.pay-option:has(input:checked){border-color:var(--blue);background:var(--sky)}.pay-option input{margin-top:6px;accent-color:var(--blue)}.pay-option b{display:block}.pay-option span{display:block;font-size:.9rem;color:var(--muted)}.actions{display:flex;gap:10px}.actions button{flex:1;padding:13px}.status{display:none;margin-top:16px;padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412}.status.show{display:block}.result-banner{display:none;margin:18px auto 0;padding:14px 18px;border-radius:14px;background:#ecfdf3;border:1px solid #abefc6;color:#067647;font-weight:700}.result-banner.show{display:block}.result-banner.pending{background:#fff7ed;border-color:#fed7aa;color:#9a3412}button:disabled{opacity:.6;cursor:not-allowed}
    footer{padding:26px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;background:#fff}

  <script>
    const API_URL='https://payment-demo-api.hungpaysho.workers.dev';
    const shopConfig=JSON.parse(document.getElementById('shop-config').textContent);['brandName','eyebrow','heroText','safeTitle','safeText','sectionTitle','sectionText','footerText'].forEach(id=>{const el=document.getElementById(id);if(el&&shopConfig[id]!=null)el.textContent=shopConfig[id]});document.getElementById('heroTitle').innerHTML=(shopConfig.heroTitle||'').replaceAll('｜','<br>');document.title=shopConfig.brandName;const products=shopConfig.products.filter(p=>p.enabled!==false);
    let cart=JSON.parse(localStorage.getItem('demoCart')||'{}');
    const $=s=>document.querySelector(s),money=n=>'NT$'+n.toLocaleString('zh-TW');
    function log(event,data={}){const logs=JSON.parse(localStorage.getItem('demoLogs')||'[]');logs.push({time:new Date().toISOString(),event,data});localStorage.setItem('demoLogs',JSON.stringify(logs.slice(-100)));console.info('[PaymentDemo]',event,data)}
    function productVisual(p){return p.image?`<img src="${p.image}" alt="${p.name}" loading="lazy">`:p.icon}
    function renderProducts(){$('#products').innerHTML=products.map(p=>`<article class="card"><div class="visual" style="--tone:${p.tone}">${productVisual(p)}</div><div class="content"><span class="tag">${p.tag}</span><h3>${p.name}</h3><p class="desc">${p.desc}</p><div class="bottom"><span class="price">${money(p.price)}</span><button class="primary" onclick="add('${p.id}')">加入購物車</button></div></div></article>`).join('')}
    function save(){localStorage.setItem('demoCart',JSON.stringify(cart));renderCart()}
    function add(id){cart[id]=(cart[id]||0)+1;save();log('cart_add',{productId:id,quantity:cart[id]});openCart()}
    function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();log('cart_quantity_change',{productId:id,delta:d})}
    function removeItem(id){delete cart[id];save();log('cart_remove',{productId:id})}
    function items(){return products.filter(p=>cart[p.id]).map(p=>({...p,qty:cart[p.id]}))}
    function renderCart(){const list=items(),count=list.reduce((s,p)=>s+p.qty,0),total=list.reduce((s,p)=>s+p.price*p.qty,0);$('#cartCount').textContent=count;$('#total').textContent=money(total);$('#summary').style.display=list.length?'block':'none';$('#cartList').innerHTML=list.length?`<div class="cart-list">${list.map(p=>`<div class="cart-item"><div class="mini">${productVisual(p)}</div><div><b>${p.name}</b><span>${money(p.price*p.qty)}</span><div class="qty"><button onclick="change('${p.id}',-1)" aria-label="減少 ${p.name}">−</button><span>${p.qty}</span><button onclick="change('${p.id}',1)" aria-label="增加 ${p.name}">＋</button></div></div><button class="remove" onclick="removeItem('${p.id}')">移除</button></div>`).join('')}</div>`:'<div class="empty">購物車目前沒有商品</div>'}
    function openCart(){$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
    function closeCart(){$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');document.body.style.overflow=''}
    $('#openCart').onclick=openCart;$('#closeCart').onclick=closeCart;$('#backdrop').onclick=closeCart;
    $('#checkout').onclick=()=>{closeCart();$('#payModal').classList.add('open');$('#status').classList.remove('show');log('checkout_open',{items:items().map(({id,qty})=>({id,qty}))})};
    $('#cancelPay').onclick=()=>{$('#payModal').classList.remove('open');openCart()};
    $('#startPay').onclick=async()=>{const provider=document.querySelector('input[name=payment]:checked').value,status=$('#status'),button=$('#startPay');status.classList.remove('show');button.disabled=true;button.textContent='正在建立正式訂單…';try{const response=await fetch(`${API_URL}/api/checkout`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider,items:items().map(p=>({id:p.id,quantity:p.qty}))})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.message||result.error||'建立訂單失敗');log('payment_redirect',{provider,orderNo:result.orderNo,amount:result.amount,requestId:result.requestId});if(result.paymentUrl){location.href=result.paymentUrl;return}if(!result.gatewayUrl||!result.fields)throw new Error('付款表單資料不完整');const payForm=document.createElement('form');payForm.method='POST';payForm.action=result.gatewayUrl;for(const [name,value] of Object.entries(result.fields)){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;payForm.appendChild(input)}document.body.appendChild(payForm);payForm.submit()}catch(error){status.textContent=`無法建立正式訂單：${error.message}`;status.classList.add('show');log('payment_create_error',{provider,message:error.message});button.disabled=false;button.textContent='前往正式付款'}};
    function showReturnResult(){const query=new URLSearchParams(location.search),payment=query.get('payment'),orderNo=query.get('orderNo');if(!payment)return;const banner=$('#resultBanner');banner.classList.add('show');if(payment==='success'){banner.textContent=`付款結果已回傳：訂單 ${orderNo||''} 付款成功。`;cart={};save()}else{banner.classList.add('pending');banner.textContent=`付款結果尚未確認：訂單 ${orderNo||''}，請以背景通知與交易查詢結果為準。`}history.replaceState({},'',location.pathname)}
    window.add=add;window.change=change;window.removeItem=removeItem;renderProducts();renderCart();showReturnResult();
  </script>
